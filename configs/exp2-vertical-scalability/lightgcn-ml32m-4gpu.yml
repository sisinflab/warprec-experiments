reader:
  loading_strategy: dataset
  data_type: transaction
  reading_method: local
  rating_type: implicit

writer:
  writing_method: local

splitter:
  test_splitting:
    strategy: temporal_leave_k_out
    k: 1

models:
  LightGCN:
    optimization:
      gpu_per_trial: 4
      cpu_per_trial: 28
      num_workers: 6
      properties:
        seed: 42
    embedding_size: 64
    n_layers: 3
    reg_weight: 0.0001
    batch_size: 4096
    learning_rate: 0.001
    epochs: 5

evaluation:
  top_k: [10]
  metrics: [nDCG, nDCGRendle2020, Recall]
  strategy: sampled
  num_negatives: 1000
  negative_sampling: uniform

general:
  device: cuda

run:
  pause_on_signal: false
