reader:
  loading_strategy: dataset
  data_type: transaction
  reading_method: local
  rating_type: implicit

writer:
  writing_method: local

splitter:
  test_splitting:
    strategy: temporal_leave_k_out
    k: 1

models:
  TwoTower:
    optimization:
      gpu_per_trial: 1
      cpu_per_trial: 9
      num_workers: 8
      properties:
        seed: 42
    embedding_size: 64
    tower_hidden_size: [64, 64]
    dropout: 0.1
    temperature: 0.07
    use_item_features: false
    correct_sampling_bias: true
    reg_weight: 0.0001
    batch_size: 4096
    learning_rate: 0.001
    epochs: 5

evaluation:
  top_k: [10]
  metrics: [nDCG, nDCGRendle2020, Recall]
  strategy: sampled
  num_negatives: 1000
  negative_sampling: uniform

general:
  device: cuda

run:
  pause_on_signal: false
