reader:
  loading_strategy: dataset
  data_type: transaction
  reading_method: local
  rating_type: implicit

writer:
  writing_method: local

splitter:
  test_splitting:
    strategy: temporal_leave_k_out
    k: 1

models:
  BPR:
    optimization:
      strategy: grid
      scheduler: fifo
      num_samples: 1
      gpu_per_trial: 1
      cpu_per_trial: 9
      max_concurrent_trials: 2
      num_workers: 8
      properties:
        seed: 42
    embedding_size: [32, 64]
    learning_rate: [0.001, 0.0005]
    reg_weight: [0.0001, 0.00001]
    batch_size: 4096
    epochs: 5

evaluation:
  top_k: [10]
  metrics: [nDCG, nDCGRendle2020, Recall]
  strategy: sampled
  num_negatives: 1000
  negative_sampling: uniform
  validation_metric: nDCG@10

dashboard:
  codecarbon:
    enabled: true
    save_to_file: true
    tracking_mode: process

general:
  device: cuda

run:
  pause_on_signal: false
